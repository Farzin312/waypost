# Waypost v1 repository contract — dogfooding waypost (including native architecture boundaries) on itself.
schema_version: "1"
name: waypost
extends: "builtin:base@1.1.0"
description: "Agent-first repository orientation, native architecture boundaries, inheritable policy, and deterministic verification CLI."
policy:
  fail_closed_on_unmapped: true
  require_frozen_lock_in_ci: true
  enforce_base_floor_in_ci: true
  trust_paths:
    - ".waypost.yaml"
    - ".waypost.lock"
    - ".github/workflows/**"
    - "action/action.yml"
    - "schemas/**"
    - "AGENTS.md"
    - "go.mod"
    - "go.sum"
boundaries:
  enabled: true
  mode: enforce
  no_cycles: true
  enforce_declared_deps: true
  ignore_paths:
    - "**/*_test.go"
  rules:
    - id: pure-leaf-packages
      from: version
      allow_depends_on: []
      reason: "internal/version must remain a zero-dependency leaf package"
    - id: presets-pure-leaf
      from: presets
      allow_depends_on: []
      reason: "internal/presets must remain a zero-dependency embedded catalog"
    - id: shellcmd-pure-leaf
      from: shellcmd
      allow_depends_on: []
      reason: "internal/shellcmd must remain a zero-dependency OS shell helper"
    - id: remote-pure-leaf
      from: remote
      allow_depends_on: []
      reason: "internal/remote must remain a zero-dependency HTTPS/cache fetcher"
    - id: config-no-higher-layers
      from: config
      deny_depends_on: ["cli", "verify", "policy", "upgrade", "archgraph"]
      reason: "internal/config cannot depend on higher orchestration packages"
rules:
  - id: preflight-before-execution
    kind: invariant
    summary: "Validate the trusted base, frozen lock, and static inputs before executing repository checks."
    reason: "An invalid checkout cannot issue a trusted receipt or run repository commands during preflight."
    verified_by:
      checks: [go-test-race]
      tests: [internal/verify/verify_regression_test.go, internal/verify/boundaries_test.go]
  - id: legacy-lock-readable
    kind: invariant
    summary: "Binaries that support schema v1 continue to verify the original frozen polyglot fixture."
    reason: "Builtin preset releases can coexist without rewriting installed locks."
    verified_by:
      checks: [go-test-race]
      tests: [internal/cli/schema_conformance_test.go, internal/cli/sync_test.go]
components:
  - id: cli-entrypoint
    root: cmd/waypost
    kind: binary
    language: go
    depends_on: ["cli"]
    entrypoints: ["cmd/waypost/main.go"]
    paths: ["cmd/waypost/**"]
    checks: ["go-vet", "go-test-race"]
  - id: cli
    root: internal/cli
    kind: package
    language: go
    depends_on: ["archgraph", "changeplan", "compmap", "config", "gitdiff", "history", "lockfile", "pins", "presets", "project", "repopath", "repoview", "spec", "syncer", "upgrade", "verify", "version", "workstate", "repowrite"]
    paths: ["internal/cli/**"]
    checks: ["go-vet", "go-test-race"]
  - id: archgraph
    root: internal/archgraph
    kind: package
    language: go
    depends_on: ["compmap", "config", "repopath", "repoview", "repowrite"]
    paths: ["internal/archgraph/**"]
    checks: ["go-vet", "go-test-race"]
  - id: config
    root: internal/config
    kind: package
    language: go
    depends_on: ["presets", "remote", "repopath", "version"]
    paths: ["internal/config/**"]
    checks: ["go-vet", "go-test-race"]
  - id: presets
    root: internal/presets
    kind: package
    language: go
    paths: ["internal/presets/**"]
    checks: ["go-vet", "go-test-race"]
  - id: remote
    root: internal/remote
    kind: package
    language: go
    paths: ["internal/remote/**"]
    checks: ["go-vet", "go-test-race"]
  - id: shellcmd
    root: internal/shellcmd
    kind: package
    language: go
    paths: ["internal/shellcmd/**"]
    checks: ["go-vet", "go-test-race"]
  - id: lockfile
    root: internal/lockfile
    kind: package
    language: go
    depends_on: ["config", "remote", "repopath", "version", "repowrite"]
    paths: ["internal/lockfile/**"]
    checks: ["go-vet", "go-test-race"]
  - id: gitdiff
    root: internal/gitdiff
    kind: package
    language: go
    paths: ["internal/gitdiff/**"]
    checks: ["go-vet", "go-test-race"]
  - id: compmap
    root: internal/compmap
    kind: package
    language: go
    depends_on: ["config", "repopath", "repoview", "shellcmd"]
    paths: ["internal/compmap/**"]
    checks: ["go-vet", "go-test-race"]
  - id: policy
    root: internal/policy
    kind: package
    language: go
    depends_on: ["archgraph", "config", "project"]
    paths: ["internal/policy/**"]
    checks: ["go-vet", "go-test-race"]
  - id: verify
    root: internal/verify
    kind: package
    language: go
    depends_on: ["archgraph", "changeplan", "compmap", "config", "gitdiff", "lockfile", "policy", "project", "repoview", "shellcmd", "version", "workstate"]
    paths: ["internal/verify/**"]
    checks: ["go-vet", "go-test-race"]
  - id: upgrade
    root: internal/upgrade
    kind: package
    language: go
    depends_on: ["config", "lockfile", "repopath", "repowrite"]
    paths: ["internal/upgrade/**"]
    checks: ["go-vet", "go-test-race"]
  - id: version
    root: internal/version
    kind: package
    language: go
    paths: ["internal/version/**"]
    checks: ["go-vet", "go-test-race"]
  - id: schemas
    root: schemas
    kind: contracts
    language: json
    paths: ["schemas/**"]
    checks: ["validate-schemas"]
  - id: action
    root: action
    kind: github-action
    language: yaml
    paths: ["action/**"]
    checks: ["go-test-race"]
  - id: docs-and-examples
    root: docs
    kind: documentation
    language: markdown
    paths: ["docs/**", "examples/**", "README.md", "AGENTS.md", "LICENSE", ".gitignore", ".github/**", ".waypost.yaml", ".waypost.lock", "go.mod", "go.sum"]
  - id: syncer
    root: internal/syncer
    language: go
    depends_on: ["archgraph", "compmap", "config", "lockfile", "pins", "project", "repopath", "repoview", "repowrite"]
    checks: ["go-vet", "go-test-race"]
  - id: changeplan
    root: internal/changeplan
    kind: package
    language: go
    depends_on: ["compmap", "config", "gitdiff"]
    paths: ["internal/changeplan/**"]
    checks: ["go-vet", "go-test-race"]
  - id: history
    root: internal/history
    kind: package
    language: go
    depends_on: ["archgraph", "changeplan", "compmap", "config", "gitdiff", "project", "repoview"]
    paths: ["internal/history/**"]
    checks: ["go-vet", "go-test-race"]
  - id: pins
    root: internal/pins
    kind: package
    language: go
    depends_on: ["config", "repopath", "repoview"]
    paths: ["internal/pins/**"]
    checks: ["go-vet", "go-test-race"]
  - id: project
    root: internal/project
    kind: package
    language: go
    depends_on: ["archgraph", "compmap", "config", "lockfile", "pins", "repopath", "repoview"]
    paths: ["internal/project/**"]
    checks: ["go-vet", "go-test-race"]
  - id: repopath
    root: internal/repopath
    kind: package
    language: go
    paths: ["internal/repopath/**"]
    checks: ["go-vet", "go-test-race"]
  - id: repoview
    root: internal/repoview
    kind: package
    language: go
    depends_on: ["gitdiff", "repopath"]
    paths: ["internal/repoview/**"]
    checks: ["go-vet", "go-test-race"]
  - id: spec
    root: internal/spec
    kind: package
    language: go
    depends_on: ["archgraph", "changeplan", "compmap", "config", "gitdiff", "history", "pins", "project", "repoview", "verify"]
    paths: ["internal/spec/**"]
    checks: ["go-vet", "go-test-race"]
  - id: workstate
    root: internal/workstate
    kind: package
    language: go
    depends_on: ["gitdiff", "repopath", "repoview"]
    paths: ["internal/workstate/**"]
    checks: ["go-vet", "go-test-race"]
  - id: repowrite
    root: internal/repowrite
    kind: package
    language: go
    depends_on: ["repopath", "repoview"]
    paths: ["internal/repowrite/**"]
    checks: ["go-vet", "go-test-race"]
checks:
  - id: go-vet
    command: "go vet ./..."
    paths: ["**/*.go", "go.mod", "go.sum"]
    required: true
    timeout_seconds: 120
    description: "Go static analysis"
  - id: go-test-race
    command: "go test -race ./..."
    paths: ["**/*.go", "internal/presets/*.yaml", "go.mod", "go.sum"]
    required: true
    timeout_seconds: 180
    description: "Full Go test suite with race detector"
  - id: validate-schemas
    command: "go test ./internal/cli -run 'SchemaConformance' -count=1"
    paths: ["schemas/**", "internal/cli/schema_conformance_test.go"]
    required: true
    requires_bin: "go"
    timeout_seconds: 60
    description: "Validate v1 schemas against CLI output and compatibility fixtures"
