name: "Waypost Verify"
description: "Run fail-closed Waypost CI verification with base-branch policy floor, frozen lockfile validation, and receipt.v1.json output."
inputs:
  base:
    description: "Base git ref for diff and policy floor evaluation (defaults to PR base ref or origin/main)."
    required: false
    default: ""
  frozen:
    description: "Require committed .waypost.lock to match exactly."
    required: false
    default: "true"
  all:
    description: "Force full repository verification regardless of diff scoping."
    required: false
    default: "false"
  receipt-path:
    description: "Output path for receipt.v1.json."
    required: false
    default: ".waypost/receipt.v1.json"
  markdown-path:
    description: "Output path for PR Markdown summary."
    required: false
    default: ".waypost/receipt.md"
  go-version:
    description: "Go version to install when waypost is not pre-installed."
    required: false
    default: "1.26"
  waypost-ref:
    description: "Release tag or Git ref of github.com/Farzin312/waypost to install."
    required: false
    default: "v0.2.0"
  sync-check:
    description: "Fail if waypost sync detects actionable drift."
    required: false
    default: "false"
outputs:
  outcome:
    description: "Verification summary outcome (PASS, WARN, or FAIL)."
    value: ${{ steps.run.outputs.outcome }}
  receipt-path:
    description: "Path to generated receipt.v1.json."
    value: ${{ inputs.receipt-path }}

runs:
  using: "composite"
  steps:
    - name: Check pre-installed waypost
      id: check_bin
      shell: bash
      run: |
        if command -v waypost >/dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download and verify Waypost release
      id: download
      if: steps.check_bin.outputs.found != 'true'
      shell: bash
      env:
        WAYPOST_REF: ${{ inputs.waypost-ref }}
      run: |
        if [[ ! "$WAYPOST_REF" =~ ^v[0-9][A-Za-z0-9._+-]*$ ]]; then
          exit 0
        fi
        TEMP_DIR="$RUNNER_TEMP"
        EXT=""
        case "$RUNNER_OS" in
          Linux) OS=linux ;;
          macOS) OS=darwin ;;
          Windows) OS=windows; EXT=".exe"; TEMP_DIR="$(cygpath -u "$TEMP_DIR")" ;;
          *) exit 0 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) exit 0 ;;
        esac

        ASSET="waypost-${OS}-${ARCH}${EXT}"
        RELEASE="https://github.com/Farzin312/waypost/releases/download/$WAYPOST_REF"
        INSTALL_DIR="$(mktemp -d "$TEMP_DIR/waypost.XXXXXX")"
        if ! curl --fail --silent --show-error --location --proto '=https' --max-time 30 \
          --output "$INSTALL_DIR/$ASSET" "$RELEASE/$ASSET"; then
          echo "Release binary unavailable. Falling back to go install."
          exit 0
        fi
        if ! curl --fail --silent --show-error --location --proto '=https' --max-time 30 \
          --output "$INSTALL_DIR/SHA256SUMS.txt" "$RELEASE/SHA256SUMS.txt"; then
          echo "Release checksums unavailable. Falling back to go install."
          exit 0
        fi
        EXPECTED="$(awk -v asset="$ASSET" '$2 == asset || $2 == "*" asset { print $1 }' "$INSTALL_DIR/SHA256SUMS.txt")"
        if [[ ! "$EXPECTED" =~ ^[[:xdigit:]]{64}$ ]]; then
          echo "::error::Missing or ambiguous SHA-256 checksum for $ASSET"
          exit 1
        fi
        (
          cd "$INSTALL_DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$EXPECTED" "$ASSET" | sha256sum --check -
          else
            printf '%s  %s\n' "$EXPECTED" "$ASSET" | shasum -a 256 --check -
          fi
        )
        mv "$INSTALL_DIR/$ASSET" "$INSTALL_DIR/waypost$EXT"
        chmod +x "$INSTALL_DIR/waypost$EXT"
        if [ "$RUNNER_OS" = "Windows" ]; then
          INSTALL_DIR="$(cygpath -w "$INSTALL_DIR")"
        fi
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "found=true" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      if: steps.check_bin.outputs.found != 'true' && steps.download.outputs.found != 'true'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install waypost binary
      if: steps.check_bin.outputs.found != 'true' && steps.download.outputs.found != 'true'
      shell: bash
      env:
        WAYPOST_REF: ${{ inputs.waypost-ref }}
      run: |
        echo "Installing github.com/Farzin312/waypost/cmd/waypost@${WAYPOST_REF}"
        go install "github.com/Farzin312/waypost/cmd/waypost@${WAYPOST_REF}"
        INSTALL_BIN="$(go env GOBIN)"
        if [ -z "$INSTALL_BIN" ]; then
          INSTALL_BIN="$(go env GOPATH)/bin"
        fi
        echo "$INSTALL_BIN" >> "$GITHUB_PATH"

    - name: Run waypost verify (CI authority)
      id: run
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_FROZEN: ${{ inputs.frozen }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_RECEIPT_PATH: ${{ inputs.receipt-path }}
        INPUT_MARKDOWN_PATH: ${{ inputs.markdown-path }}
      run: |
        # Remove any stale receipt/markdown from earlier steps so outcome always reflects this run.
        rm -f "$INPUT_RECEIPT_PATH" "$INPUT_MARKDOWN_PATH"

        BASE_REF="$INPUT_BASE"
        if [ -z "$BASE_REF" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          BASE_REF="origin/${GITHUB_BASE_REF}"
        fi

        ARGS=(verify --mode ci --receipt "$INPUT_RECEIPT_PATH" --markdown "$INPUT_MARKDOWN_PATH")
        if [ -n "$BASE_REF" ]; then
          ARGS+=(--base "$BASE_REF")
        fi
        if [ "$INPUT_FROZEN" = "true" ]; then
          ARGS+=(--frozen)
        fi
        if [ "$INPUT_ALL" = "true" ]; then
          ARGS+=(--all)
        fi

        set +e
        waypost "${ARGS[@]}"
        EXIT_CODE=$?
        set -e

        if [ -f "$INPUT_MARKDOWN_PATH" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat "$INPUT_MARKDOWN_PATH" >> "$GITHUB_STEP_SUMMARY"
        fi

        OUTCOME="FAIL"
        if [ -f "$INPUT_RECEIPT_PATH" ]; then
          OUTCOME=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["outcome"])' "$INPUT_RECEIPT_PATH" 2>/dev/null || echo "FAIL")
        fi
        echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"

    - name: Check Waypost drift
      if: ${{ !cancelled() && inputs.sync-check == 'true' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
      shell: bash
      env:
        INPUT_FROZEN: ${{ inputs.frozen }}
      run: |
        ARGS=(sync --check)
        if [ "$INPUT_FROZEN" = "true" ]; then
          ARGS+=(--offline)
        fi
        waypost "${ARGS[@]}"
